[project]
name = "gkx"
version = "0.1.0"
description = "Replication of Gu, Kelly & Xiu (2020) with a post-publication holdout"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "wrds>=3.2",
    "python-dotenv>=1.0",
    "openassetpricing==0.0.2",
    "requests>=2.34.2",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.9.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=8",
    "ruff>=0.6",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gkx"]

[tool.ruff]
line-length = 100
