# Runs every test that needs no licensed data. Two tests in tests/test_feature_map.py read the
# licensed GKX datashare and OSAP files (not in the repo) and are deselected here; tests/nn runs in
# its own process because torch and LightGBM must never share one (D038).
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the freeze-v1/freeze-v2 whitelist tests need the tags
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Main suite (synthetic data only)
        run: >-
          uv run pytest -q -W error
          --deselect tests/test_feature_map.py::test_every_gkx_characteristic_appears_exactly_once
          --deselect tests/test_feature_map.py::test_osap_signals_are_published_predictors
      - name: Neural-net suite (separate process)
        run: GKX_TORCH=1 uv run pytest -q -W error tests/nn
